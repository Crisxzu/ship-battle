name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests and generate JaCoCo report
        run: ./gradlew :core:test :core:jacocoTestReport

      - name: Generate Javadoc
        run: ./gradlew :core:javadoc

      - name: Prepare documentation site
        run: |
          mkdir -p site

          # Create index page
          cat > site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="fr">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>ShipBattle - Documentation</title>
              <style>
                  * { box-sizing: border-box; margin: 0; padding: 0; }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
                      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
                      min-height: 100vh;
                      color: #e0e0e0;
                  }
                  .container {
                      max-width: 900px;
                      margin: 0 auto;
                      padding: 40px 20px;
                  }
                  header {
                      text-align: center;
                      margin-bottom: 50px;
                  }
                  h1 {
                      font-size: 3rem;
                      color: #4fc3f7;
                      margin-bottom: 10px;
                  }
                  .subtitle {
                      font-size: 1.2rem;
                      color: #90a4ae;
                  }
                  .cards {
                      display: grid;
                      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                      gap: 25px;
                      margin-top: 30px;
                  }
                  .card {
                      background: rgba(255,255,255,0.05);
                      border-radius: 15px;
                      padding: 30px;
                      text-decoration: none;
                      color: inherit;
                      transition: transform 0.3s, box-shadow 0.3s;
                      border: 1px solid rgba(255,255,255,0.1);
                  }
                  .card:hover {
                      transform: translateY(-5px);
                      box-shadow: 0 10px 40px rgba(79, 195, 247, 0.2);
                      border-color: #4fc3f7;
                  }
                  .card h2 {
                      color: #4fc3f7;
                      margin-bottom: 15px;
                      font-size: 1.5rem;
                  }
                  .card p {
                      color: #b0bec5;
                      line-height: 1.6;
                  }
                  .card .icon {
                      font-size: 2.5rem;
                      margin-bottom: 15px;
                  }
                  footer {
                      text-align: center;
                      margin-top: 60px;
                      padding-top: 30px;
                      border-top: 1px solid rgba(255,255,255,0.1);
                      color: #78909c;
                  }
                  footer a {
                      color: #4fc3f7;
                      text-decoration: none;
                  }
                  footer a:hover {
                      text-decoration: underline;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <header>
                      <h1>ShipBattle</h1>
                      <p class="subtitle">Documentation du projet</p>
                  </header>

                  <div class="cards">
                      <a href="javadoc/index.html" class="card">
                          <div class="icon">📚</div>
                          <h2>Javadoc</h2>
                          <p>Documentation complète de l'API Java du projet. Classes, méthodes, interfaces et annotations.</p>
                      </a>

                      <a href="coverage/index.html" class="card">
                          <div class="icon">📊</div>
                          <h2>Couverture de code</h2>
                          <p>Rapport JaCoCo détaillant la couverture des tests unitaires par package et par classe.</p>
                      </a>
                  </div>

                  <footer>
                      <p>Projet Epitech 2025 -
                          <a href="https://github.com/Crisxzu">@Crisxzu</a> ·
                          <a href="https://github.com/OhBadBoy">@OhBadBoy</a> ·
                          <a href="https://github.com/Daoudbamba">@Daoudbamba</a>
                      </p>
                  </footer>
              </div>
          </body>
          </html>
          EOF

          # Copy Javadoc
          cp -r core/build/docs/javadoc site/javadoc

          # Copy JaCoCo report
          cp -r core/build/reports/jacoco/test/html site/coverage

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4